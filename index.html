<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AZO Controle">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<style>
  :root{
    --ink:#141414;
    --ink-soft:#4A4A4A;
    --paper:#F2F1EF;
    --paper-dim:#E6E4E0;
    --card:#FFFFFF;
    --thread:#F36F21;   /* AutoZone orange */
    --az-red:#E4032E;   /* AutoZone red */
    --az-black:#0D0D0D;
    --amber:#C98A2C;
    --green:#3F6B4F;
    --red:#C21F2F;
    --line:#DEDCD6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Roboto Slab',serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--thread);color:#fff;}

  /* App shell */
  .app{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:-28px -20px 28px;padding:14px 20px 16px;background:var(--az-black);border-bottom:4px solid var(--thread);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img.logo{height:30px;width:auto;display:block;}
  .brand h1{font-size:19px;margin:0;color:#fff;font-weight:700;}
  .brand .sub{font-size:12px;color:#c9c9c9;font-family:'IBM Plex Mono',monospace;}
  .topbar-actions button{background:var(--thread);color:#111;border:none;padding:10px 16px;border-radius:3px;font-weight:700;font-size:13.5px;}
  .topbar-actions button:hover{background:var(--az-red);color:#fff;}

  .empty{border:2px dashed var(--line);border-radius:8px;padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty h3{margin:0 0 6px;}
  .empty p{margin:0 0 16px;font-size:14px;}
  .empty button{background:var(--thread);color:#fff;border:none;padding:10px 18px;border-radius:3px;font-weight:600;}

  /* Client "tag" cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .tag{
    position:relative;background:var(--card);border:1.5px solid var(--ink);border-radius:6px;
    padding:16px 16px 14px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  }
  .tag:hover{transform:translateY(-2px);box-shadow:4px 6px 0 rgba(27,31,42,0.12);}
  .tag::before{
    content:"";position:absolute;top:14px;left:-7px;width:12px;height:12px;background:var(--paper);
    border:1.5px solid var(--ink);border-radius:50%;
  }
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tag-name{font-family:'Roboto Slab',serif;font-weight:700;font-size:17px;margin:0 0 2px;}
  .tag-phone{font-size:12.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap;}
  .badge.aberto{background:rgba(63,107,79,0.14);color:var(--green);}
  .badge.bloqueado{background:rgba(162,59,59,0.14);color:var(--red);}
  .badge.urgente{background:rgba(196,49,49,0.16);color:#C43131;}
  .badge.proximo{background:rgba(201,138,44,0.16);color:var(--amber);}
  .badge.atencao80{background:rgba(201,138,44,0.2);color:#8a5a00;}
  .bar-track{height:6px;background:var(--paper-dim);border-radius:4px;margin:12px 0 6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--thread);}
  .bar-fill.over{background:var(--red);}
  .bar-fill.urgente-bar{background:#C43131;}
  .bar-fill.proximo-bar{background:var(--amber);}
  .bar-fill.warn80{background:var(--amber);}
  .cobranca-banner{border:1.5px solid var(--amber);background:rgba(201,138,44,0.08);border-radius:8px;padding:14px 16px;margin-bottom:20px;}
  .cobranca-banner h3{margin:0 0 10px;font-size:15px;}
  .cobranca-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px;flex-wrap:wrap;}
  .cobranca-row:first-of-type{border-top:none;}
  .mono-small{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .tag-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  /* Buttons */
  .btn{border:none;border-radius:3px;padding:9px 14px;font-size:13.5px;font-weight:600;}
  .btn-dark{background:var(--ink);color:var(--paper);}
  .btn-dark:hover{background:var(--ink-soft);}
  .btn-outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}
  .btn-outline:hover{background:var(--ink);color:var(--paper);}
  .btn-thread{background:var(--thread);color:#fff;}
  .btn-thread:hover{opacity:.88;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:3px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* Detail view */
  .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;margin-bottom:14px;padding:0;text-decoration:underline;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .detail-head h2{margin:0 0 4px;font-size:24px;}
  .detail-stats{display:flex;gap:20px;flex-wrap:wrap;margin:14px 0 20px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);}
  .detail-stats b{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:16px;color:var(--ink);}

  .warn-strip{background:rgba(201,138,44,0.15);border:1px solid var(--amber);color:#7a5a1a;padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:16px;}

  /* Nota / receipt rows */
  .ledger{border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card);}
  .nota-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px dashed var(--line);}
  .nota-row:last-child{border-bottom:none;}
  .nota-row.arquivada{opacity:.55;}
  .nota-info{flex:1;min-width:0;}
  .nota-desc{font-weight:600;font-size:14.5px;margin:0 0 3px;}
  .nota-sub{font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .nota-value{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:14px;white-space:nowrap;}
  .chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .chip.pendente{background:rgba(201,138,44,0.16);color:var(--amber);}
  .chip.assinada{background:rgba(63,107,79,0.16);color:var(--green);}
  .chip.devolucao{background:rgba(196,49,49,0.14);color:var(--red);margin-left:6px;}
  .chip.contestada{background:var(--red);color:#fff;margin-left:6px;}
  .nota-row.contestada{background:rgba(196,49,49,0.06);}
  .nota-value.negativo{color:var(--red);}
  .nota-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .close-cycle{display:flex;justify-content:flex-end;margin-top:18px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(27,31,42,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--card);border-radius:8px;max-width:420px;width:100%;padding:24px;border:1.5px solid var(--ink);max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:19px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink-soft);}
  .field input,.field select{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:4px;font-size:14px;font-family:inherit;background:#fff;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--thread);}
  .field input.input-error,.field select.input-error{border-color:var(--red);box-shadow:0 0 0 1px var(--red);background:rgba(196,49,49,0.04);}
  .search-bar{margin-bottom:16px;}
  .search-bar input{width:100%;padding:11px 14px;border:1.5px solid var(--ink);border-radius:5px;font-size:14px;font-family:inherit;background:var(--card);}
  .search-bar input:focus{outline:none;border-color:var(--thread);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  /* Link box */
  .linkbox{display:flex;gap:6px;margin-top:10px;}
  .linkbox input{flex:1;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px;border:1.5px solid var(--line);border-radius:4px;background:#fff;}
  .copied{color:var(--green);font-size:12px;font-weight:600;margin-top:6px;}

  /* Signing page (customer-facing) */
  .sign-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .sign-card{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;max-width:460px;width:100%;padding:28px 24px;text-align:center;}
  .sign-card .mark{display:inline-block;margin-bottom:14px;}
  .sign-card .mark img{height:26px;width:auto;display:block;margin:0 auto;}
  .sign-wrap{background:var(--az-black);}
  .sign-card h2{margin:0 0 4px;font-size:20px;}
  .sign-card .store-line{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .sign-details{text-align:left;background:var(--paper);border-radius:6px;padding:14px 16px;margin-bottom:18px;font-size:13.5px;}
  .sign-details div{display:flex;justify-content:space-between;padding:4px 0;}
  .sign-details div + div{border-top:1px dashed var(--line);}
  .canvas-wrap{border:2px dashed var(--ink-soft);border-radius:8px;background:#fff;margin-bottom:12px;position:relative;}
  .canvas-wrap canvas{width:100%;display:block;touch-action:none;border-radius:6px;}
  .canvas-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b9b2a0;font-size:13px;pointer-events:none;}
  .sign-actions{display:flex;gap:10px;}
  .sign-actions button{flex:1;padding:12px;border-radius:4px;font-size:14px;font-weight:600;}
  .signed-ok{padding:20px 0;}
  .stamp{width:74px;height:74px;border-radius:50%;border:3px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px;transform:rotate(-8deg);}
  .footnote{font-size:11.5px;color:var(--ink-soft);margin-top:16px;line-height:1.5;}

  /* Promo footer — always white background, like the AutoZone site */
  .promo-footer{background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:18px 16px;margin-top:28px;}
  .promo-footer h3{margin:0 0 14px;font-size:15px;color:var(--ink);}
  .promo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .promo-card{cursor:pointer;border:1px solid #EAEAEA;border-radius:6px;overflow:hidden;background:#fff;transition:transform .15s ease, box-shadow .15s ease;}
  .promo-card:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,0.1);}
  .promo-card img{width:100%;display:block;aspect-ratio:16/6;object-fit:cover;}
  .promo-card p{margin:0;padding:8px 10px;font-size:12px;color:var(--ink);line-height:1.35;}

  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);}
</style>
</head>

  function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2)); }
  function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }

  async function createOrResetClientAccess(email){
    var tempPass = uid() + uid();
    try{
      await secondaryAuth.createUserWithEmailAndPassword(email, tempPass);
    }catch(e){
      if (e.code !== 'auth/email-already-in-use') throw e;
      // conta já existe — tudo bem, só vamos mandar o link de redefinição
    }
    await secondaryAuth.sendPasswordResetEmail(email);
    try{ await secondaryAuth.signOut(); }catch(e){ /* ignore */ }
  }

  function waitForAuth(){
    return new Promise(function(resolve){
      auth.onAuthStateChanged(function(user){
        if (user){ resolve(user); }
        else { auth.signInAnonymously().catch(function(e){ console.error('Falha no login anônimo do Firebase', e); }); }
      });
      auth.signInAnonymously().catch(function(e){ console.error('Falha no login anônimo do Firebase', e); });
    });
  }

  async function loadAll(){
    try{ await waitForAuth(); }catch(e){ /* onAuthStateChanged handles retry */ }

    db.collection('clientes').onSnapshot(function(snap){
      state.clients = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state._clientsReady = true;
      if (state._clientsReady && state._notasReady) state.loaded = true;
      render();
    }, function(err){ console.error('Erro lendo clientes:', err); state.storageOk = false; });

    db.collection('notas').where('arquivado','==', false).onSnapshot(function(snap){
      state.notas = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state._notasReady = true;
      if (state._clientsReady && state._notasReady) state.loaded = true;
      render();
    }, function(err){ console.error('Erro lendo notas:', err); state.storageOk = false; });
  }

  async function getConfig(){
    try{
      var doc = await db.collection('config').doc('main').get();
      return doc.exists ? doc.data() : {};
    }catch(e){ return {}; }
  }
  async function saveConfig(cfg){
    try{ await db.collection('config').doc('main').set(cfg, {merge:true}); }catch(e){ /* best-effort */ }
  }
  async function appendLog(entry){
    try{ await db.collection('log').add(entry); }catch(e){ /* best-effort */ }
  }
  async function pushArquivo(record){
    try{
      var docRef = db.collection('arquivos').doc();
      await docRef.set(record);
      return docRef.id;
    }catch(e){ return null; }
  }
  async function getArquivoForClient(clientId){
    try{
      var snap = await db.collection('arquivos').where('clienteId','==',clientId).get();
      var list = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      list.sort(function(x,y){ return y.fechadoEm - x.fechadoEm; });
      return list;
    }catch(e){ return []; }
  }
  async function fetchNotasForArquivo(arquivoId){
    try{
      var snap = await db.collection('notas').where('cicloArquivoId','==',arquivoId).get();
      return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    }catch(e){ return []; }
  }
  function showToast(msg){
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--az-black);color:#fff;padding:12px 20px;border-radius:6px;border-left:4px solid var(--thread);font-size:13.5px;z-index:100;box-shadow:0 6px 18px rgba(0,0,0,0.25);max-width:90vw;text-align:center;';
    document.body.appendChild(t);
    setTimeout(function(){ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(function(){ t.remove(); }, 400); }, 3600);
  }

  async function sha256Hex(text){
    var buf = new TextEncoder().encode(text);
    var hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  // Two supervisor passwords authorize sending paid notas to the archive.
  // Setup happens once; afterwards only the password is asked (not the name),
  // so the log always shows the name tied to whichever password was used.
  function requestSupervisorAuth(actionLabel){
    return new Promise(async function(resolve){
      var cfg = await getConfig();
      var slots = (cfg.supervisores || []).filter(Boolean);
      if (slots.length < 2){
        openSupervisorSetupModal(slots, resolve);
        return;
      }
      var overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML =
        '<div class="modal">'+
          '<h3>Autorização de supervisor</h3>'+
          '<p style="font-size:13px;color:var(--ink-soft);margin-top:0;">Ação: '+escapeHtml(actionLabel)+'. Apenas os 2 supervisores cadastrados podem autorizar.</p>'+
          '<div class="field"><label>Senha do supervisor</label><input id="supPass" type="password" placeholder="Senha"></div>'+
          '<div class="modal-actions"><button class="btn btn-outline" id="supCancel">Cancelar</button><button class="btn btn-dark" id="supOk">Autorizar</button></div>'+
        '</div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e){ if (e.target === overlay){ overlay.remove(); resolve(null); } });
      document.getElementById('supCancel').addEventListener('click', function(){ overlay.remove(); resolve(null); });
      document.getElementById('supOk').addEventListener('click', async function(){
        var pass = document.getElementById('supPass').value;
        if (!pass){ alert('Digite a senha.'); return; }
        var hash = await sha256Hex(pass);
        var match = slots.find(function(s){ return s.hash === hash; });
        overlay.remove();
        if (!match){ alert('Senha incorreta.'); resolve(null); return; }
        resolve(match.nome);
      });
    });
  }
  function openSupervisorSetupModal(existingSlots, resolve){
    var idx = existingSlots.length; // 0 = configuring 1st, 1 = configuring 2nd
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>Configurar supervisor '+(idx+1)+' de 2</h3>'+
        '<p style="font-size:13px;color:var(--ink-soft);margin-top:0;">Ainda não há '+(idx===0?'nenhuma':'a segunda')+' senha de supervisor cadastrada. Só essas 2 pessoas vão poder mandar notas pagas pro arquivo morto.</p>'+
        '<div class="field"><label>Nome do supervisor</label><input id="supNome" type="text" placeholder="Nome completo"></div>'+
        '<div class="field"><label>Criar senha</label><input id="supNovaSenha" type="password" placeholder="Senha"></div>'+
        '<div class="modal-actions"><button class="btn btn-outline" id="supSetupCancel">Cancelar</button><button class="btn btn-dark" id="supSetupOk">Salvar</button></div>'+
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if (e.target === overlay){ overlay.remove(); resolve(null); } });
    document.getElementById('supSetupCancel').addEventListener('click', function(){ overlay.remove(); resolve(null); });
    document.getElementById('supSetupOk').addEventListener('click', async function(){
      var nome = document.getElementById('supNome').value.trim();
      var senha = document.getElementById('supNovaSenha').value;
      if (!nome || !senha){ alert('Preencha nome e senha.'); return; }
      var hash = await sha256Hex(senha);
      var cfg = await getConfig();
      var slots = (cfg.supervisores || []).filter(Boolean);
      slots.push({ nome: nome, hash: hash });
      cfg.supervisores = slots;
      await saveConfig(cfg);
      overlay.remove();
      if (slots.length < 2){
        showToast('Supervisor 1 salvo. Configure o segundo quando alguém tentar de novo.');
        resolve(nome); // first setup also authorizes this action
      } else {
        resolve(nome);
      }
    });
  }

  function clientNotas(clientId){
    return state.notas.filter(function(n){ return n.clienteId === clientId; });
  }
  function clientUsed(clientId){
    return clientNotas(clientId).reduce(function(sum, n){ return sum + Number(n.valor||0); }, 0);
  }
  function clientStatus(client){
    var used = clientUsed(client.id);
    var pct = used / (client.limite || 1);
    var diasRestantes = daysLeft(client.cicloFim);
    if (used >= client.limite) return { status: 'bloqueado', motivo: 'limite' };
    if (Date.now() > client.cicloFim) return { status: 'bloqueado', motivo: 'vencido' };
    if (pct >= 0.8) return { status: 'atencao80', motivo: null };
    if (diasRestantes <= 3) return { status: 'urgente', motivo: null };
    if (diasRestantes <= 10) return { status: 'proximo', motivo: null };
    return { status: 'aberto', motivo: null };
  }
  function veiculoLabel(n){
    var parts = [n.marca, n.modelo, n.ano].filter(Boolean).join(' ');
    var out = 'Peças para ' + (parts || 'veículo não informado');
    if (n.motor) out += ' (' + n.motor + ')';
    if (n.tipoNota === 'devolucao') out += ' — DEVOLUÇÃO';
    return out;
  }
  function onlyDigits(s){ return (s||'').replace(/\D/g, ''); }
  function findDuplicateClient(pin, telefone){
    var pinNorm = (pin||'').trim().toLowerCase();
    var telNorm = onlyDigits(telefone);
    return state.clients.find(function(c){
      if (pinNorm && (c.pin||'').trim().toLowerCase() === pinNorm) return true;
      if (telNorm && onlyDigits(c.telefone) === telNorm && telNorm.length >= 8) return true;
      return false;
    });
  }
  function markFieldError(el){

    var hash = window.location.hash || '';

  async function renderEmployeeGate(){
    var root = document.getElementById('root');
    if (!state.loaded){
      root.innerHTML = '<div class="loading">Carregando…</div>';
      return;
    }
    var cfg = await getConfig();
    var colaboradores = (cfg.colaboradores || []).filter(Boolean);
    // Migra a senha única antiga (se existir) para um colaborador chamado "Equipe", sem forçar recadastro.
    if (colaboradores.length === 0 && cfg.employeePasswordHash){
      colaboradores = [{ nome: 'Equipe', hash: cfg.employeePasswordHash }];
    }
    var isFirstSetup = colaboradores.length === 0;
    root.innerHTML =
      '<div class="sign-wrap"><div class="sign-card">'+
        '<span class="mark"><img src="'+LOGO_DATA_URI+'" alt="AutoZone"></span>'+
        '<h2>'+(isFirstSetup ? 'Primeiro acesso' : 'Acesso restrito')+'</h2>'+
        '<p class="store-line">'+(isFirstSetup ? 'Cadastre o primeiro login de colaborador AutoZone. Cada pessoa da equipe pode ter o seu próprio, depois, em Configurações.' : 'Este app é só para colaboradores AutoZone. Entre com seu nome e sua senha.')+'</p>'+
        (isFirstSetup ?
          '<div class="field" style="text-align:left;"><label>Seu nome</label><input id="empNewNome" type="text" placeholder="Nome completo"></div>'+
          '<div class="field" style="text-align:left;"><label>Criar sua senha</label><input id="empNewPass" type="password" placeholder="Senha"></div>'
          :
          '<div class="field" style="text-align:left;"><label>Sua senha</label><input id="empPass" type="password" placeholder="Senha"></div>'
        )+
        '<div class="sign-actions"><button class="btn btn-green" id="empEnter" style="flex:1;">'+(isFirstSetup?'Salvar e entrar':'Entrar')+'</button></div>'+
      '</div></div>';
    document.getElementById('empEnter').addEventListener('click', async function(){
      if (isFirstSetup){
        var nome = document.getElementById('empNewNome').value.trim();
        var pass = document.getElementById('empNewPass').value;
        if (!nome || !pass){ alert('Preencha seu nome e uma senha.'); return; }
        var hash = await sha256Hex(pass);
        var c = await getConfig();
        c.colaboradores = [{ nome: nome, hash: hash }];
        await saveConfig(c);
        state.employeeAuthed = true;
        state.currentColaborador = nome;
        render();
      } else {
        var typed = document.getElementById('empPass').value;
        var hash2 = await sha256Hex(typed);
        var match = colaboradores.find(function(cl){ return cl.hash === hash2; });
        if (match){
          state.employeeAuthed = true;
          state.currentColaborador = match.nome;
          render();
        } else {
          alert('Senha incorreta.');
        }
      }
    });
  }

  function statusBadgeLabel(s){
    if (s.status === 'bloqueado') return s.motivo === 'limite' ? 'Bloqueado — limite atingido' : 'Bloqueado — ciclo vencido';
    if (s.status === 'atencao80') return 'Atenção — 80% do limite';
    if (s.status === 'urgente') return 'Vence em breve';
    if (s.status === 'proximo') return 'Atenção ao prazo';
    return 'Aberto';
  }
  function statusBadgeClass(s){
    if (s.status === 'bloqueado') return 'bloqueado';
    if (s.status === 'atencao80') return 'atencao80';
    if (s.status === 'urgente') return 'urgente';
    if (s.status === 'proximo') return 'proximo';
    return 'aberto';
  }
  function barClass(s, pct){
    if (pct >= 100 || s.status === 'bloqueado') return 'over';
    if (s.status === 'atencao80') return 'warn80';
    if (s.status === 'urgente') return 'urgente-bar';
    if (s.status === 'proximo') return 'proximo-bar';
    return '';
  }
  function urgencyRank(s){
    if (s.status === 'bloqueado') return 0;
    if (s.status === 'urgente') return 1;
    if (s.status === 'atencao80') return 2;
    if (s.status === 'proximo') return 3;
    return 4;
  }
  function whatsappCobrancaUrl(c, used){
    if (!c.telefone) return null;
    var digits = c.telefone.replace(/\D/g, '');
    var dleft = daysLeft(c.cicloFim);
    var venceTxt = dleft >= 0 ? ('vence em '+dleft+' dia(s)') : 'já venceu';
    var msg = 'Olá '+c.nome+'! Passando para lembrar sobre o saldo AZO (PIN '+(c.pin||'-')+'): '+fmtMoney(used)+' — '+venceTxt+'. Qualquer dúvida, estamos à disposição.';
    return 'https://wa.me/55'+digits+'?text='+encodeURIComponent(msg);
  }

  // ---------- PANEL (attendant view) ----------
  function renderPanel(){
    var root = document.getElementById('root');
    if (!state.loaded){
      root.innerHTML = '<div class="loading">Carregando dados da loja…</div>';
      return;
    }
    if (state.selectedClient){
      renderClientDetail(state.selectedClient);
      return;
    }
    var html = '';
    html += '<div class="app">';
    html += topbarHtml();
    if (state.clients.length === 0){
      html += '<div class="empty"><h3>Nenhum cliente AZO cadastrado</h3><p>Cadastre o primeiro cliente para começar a controlar créditos e notas assinadas.</p><button id="btnEmptyAdd">+ Novo cliente</button></div>';
    } else {
      var withStatus = state.clients.map(function(c){ return { c: c, used: clientUsed(c.id), status: clientStatus(c) }; });
      withStatus.sort(function(a,b){
        var r = urgencyRank(a.status) - urgencyRank(b.status);
        if (r !== 0) return r;
        return a.c.cicloFim - b.c.cicloFim;
      });
      var cobranca = withStatus.filter(function(w){ return w.status.status !== 'aberto'; });
      if (cobranca.length > 0){
        html += '<div class="cobranca-banner"><h3>🔔 Cobranças que precisam de atenção</h3>';
        cobranca.forEach(function(w){
          var wa = whatsappCobrancaUrl(w.c, w.used);
          var dleft = daysLeft(w.c.cicloFim);
          html += '<div class="cobranca-row">';
          html += '<div><b>'+escapeHtml(w.c.nome)+'</b> <span class="mono-small">PIN '+escapeHtml(w.c.pin||'-')+'</span> — '+fmtMoney(w.used)+' <span class="badge '+statusBadgeClass(w.status)+'">'+statusBadgeLabel(w.status)+'</span></div>';
          html += (wa ? '<a class="btn btn-sm btn-green" style="text-decoration:none;" href="'+wa+'" target="_blank" rel="noopener">Cobrar via WhatsApp</a>' : '<span class="footnote">sem telefone cadastrado</span>');
          html += '</div>';
        });
        html += '</div>';
      }
      html += '<div class="search-bar"><input id="clientSearch" type="text" placeholder="Buscar cliente por nome, PIN ou telefone…" value="'+escapeHtml(state.searchTerm||'')+'"></div>';
      html += '<div class="grid" id="clientGrid">';
      withStatus.forEach(function(w){
        var c = w.c, used = w.used, status = w.status;
        var pct = Math.max(0, Math.min(100, Math.round((used / (c.limite||1)) * 100)));
        var dleft = daysLeft(c.cicloFim);
        var searchKey = (c.nome+' '+(c.pin||'')+' '+(c.telefone||'')).toLowerCase();
        html += '<div class="tag" data-client="'+c.id+'" data-search="'+escapeHtml(searchKey)+'">';
        html += '<div class="tag-top"><div><p class="tag-name">'+escapeHtml(c.nome)+'</p><p class="tag-phone">'+escapeHtml(c.telefone||'')+(c.pin ? ' · PIN '+escapeHtml(c.pin) : '')+'</p></div>';
        html += '<span class="badge '+statusBadgeClass(status)+'">'+statusBadgeLabel(status)+'</span></div>';
        html += '<div class="bar-track"><div class="bar-fill '+barClass(status, pct)+'" style="width:'+pct+'%"></div></div>';
        html += '<div class="tag-meta"><span>'+fmtMoney(used)+' / '+fmtMoney(c.limite)+'</span><span>'+(dleft>=0?dleft+'d restantes':'ciclo vencido')+'</span></div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += promoFooterHtml();
    html += '</div>';
    root.innerHTML = html;

    var addBtn = document.getElementById('btnAddClient') || document.getElementById('btnEmptyAdd');
    if (addBtn) addBtn.addEventListener('click', openNewClientModal);
    var settingsBtn = document.getElementById('btnSettings');
    if (settingsBtn) settingsBtn.addEventListener('click', openSettingsModal);
    wirePromoFooter(root);
    var searchInput = document.getElementById('clientSearch');
    if (searchInput){
      searchInput.addEventListener('input', function(){
        state.searchTerm = searchInput.value;
        var q = searchInput.value.trim().toLowerCase();
        document.querySelectorAll('#clientGrid [data-search]').forEach(function(el){
          el.style.display = (!q || el.getAttribute('data-search').indexOf(q) !== -1) ? '' : 'none';
        });
      });
      searchInput.addEventListener('keydown', function(e){
        if (e.key !== 'Enter') return;
        var q = searchInput.value.trim().toLowerCase();
        if (!q) return;
        var visible = Array.from(document.querySelectorAll('#clientGrid [data-search]')).filter(function(el){ return el.style.display !== 'none'; });
        var exactPin = state.clients.find(function(c){ return (c.pin||'').toLowerCase() === q; });
        if (exactPin){ state.selectedClient = exactPin.id; render(); return; }
        if (visible.length === 1){ state.selectedClient = visible[0].getAttribute('data-client'); render(); }
      });
    }
    root.querySelectorAll('[data-client]').forEach(function(el){
      el.addEventListener('click', function(){
        state.selectedClient = el.getAttribute('data-client');
        state.dateFilter = { from: null, to: null };
        render();
      });
    });
  }

  // ---------- Photo capture (mandatory first step for every nota) ----------
  function compressImageFile(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){
          var scale = Math.min(1, maxWidth / img.width);
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality), canvas: canvas });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  // Lightweight "scan mode": grayscale + contrast boost so the photo reads more like a scanned document.
  // This is not true perspective-correction/auto-crop scanning (that needs a heavier vision library) —
  // just a fast filter to make handwriting/print more legible.
  function enhanceScanLook(dataUrl){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var d = imgData.data;
        var contrast = 1.35, mid = 128;
        for (var i = 0; i < d.length; i += 4){
          var gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          gray = (gray - mid) * contrast + mid;
          gray = Math.max(0, Math.min(255, gray));
          d[i] = d[i+1] = d[i+2] = gray;
        }
        ctx.putImageData(imgData, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.src = dataUrl;
    });
  }

  function setupCanvas(canvas, hintEl){
    var ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1B1F2A';
    var drawing = false, hasDrawn = false;
    function pos(e){
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }
    function start(e){ drawing = true; hasDrawn = true; if(hintEl) hintEl.style.display='none'; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
    function move(e){ if(!drawing) return; var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
    function end(){ drawing = false; }
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
  }

  async function deleteNota(notaId){
    var nota = state.notas.find(function(n){ return n.id === notaId; });
    if (!nota) return;
    var client = state.clients.find(function(c){ return c.id === nota.clienteId; });
    var supervisorNome = await requestSupervisorAuth('Excluir a nota "'+veiculoLabel(nota)+'"'+(client?' de '+client.nome:''));

    await appendLog({ tipo: 'excluir_nota', quem: supervisorNome, quando: Date.now(), detalhe: (client?client.nome+' — ':'')+veiculoLabel(nota)+' ('+fmtMoney(nota.valor)+')' });

  async function closeCycle(client){
    var notas = clientNotas(client.id);
    if (notas.length === 0){ alert('Não há notas neste ciclo para fechar.'); return; }
    var pendentes = notas.filter(function(n){ return n.status === 'pendente'; });
    if (pendentes.length > 0){
      var ok = confirm(pendentes.length + ' nota(s) ainda não foram assinadas pelo cliente. Tem certeza que quer fechar o ciclo mesmo assim?');
      if (!ok) return;
    }
    var supervisorNome = await requestSupervisorAuth('Mandar as notas de "'+client.nome+'" para o arquivo morto (dar baixa)');
    if (!supervisorNome) return;

    generatePdf(client, notas);

    var arquivarIds = notas.map(function(n){ return n.id; });
    var totalValor = notas.reduce(function(s,n){return s+Number(n.valor||0);},0);
    var arquivoId = null;
    try{
      arquivoId = await pushArquivo({ clienteId: client.id, clienteNome: client.nome, clientePin: client.pin, cicloInicio: client.cicloInicio, cicloFim: client.cicloFim, fechadoEm: Date.now(), autorizadoPor: supervisorNome, totalNotas: notas.length, totalValor: totalValor });
      var batch = db.batch();
      arquivarIds.forEach(function(id){
        batch.update(db.collection('notas').doc(id), { arquivado: true, cicloArquivoId: arquivoId });
      });
      await batch.commit();
    }catch(e){ showToast('Erro ao arquivar o ciclo. Tente novamente — nada foi perdido.'); return; }
    state.notas = state.notas.filter(function(n){ return arquivarIds.indexOf(n.id) === -1; });
    await appendLog({ tipo: 'arquivar_ciclo', quem: supervisorNome, quando: Date.now(), detalhe: client.nome + ' — ' + notas.length + ' nota(s), ' + fmtMoney(totalValor) });

    var now = Date.now();
    client.cicloInicio = now;
    client.cicloFim = now + CICLO_DIAS*24*60*60*1000;
    try{ await db.collection('clientes').doc(client.id).update({ cicloInicio: client.cicloInicio, cicloFim: client.cicloFim }); }catch(e){ showToast('Aviso: o novo ciclo pode não ter salvo, confira o cliente.'); }
    render();
    showToast('✓ Arquivado por '+supervisorNome+' — PDF gerado, novo ciclo de 15 dias iniciado');
    offerEmailToClient(client);
  }

  function generatePdf(client, notas){
    if (!window.jspdf){ alert('Não foi possível carregar o gerador de PDF. Tente novamente em instantes.'); return; }
    var doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    var pageW = 210, margin = 16, y = 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('AZO — Comprovante de Ciclo', margin, y); y += 8;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text('Cliente: ' + client.nome + (client.pin ? '   (PIN ' + client.pin + ')' : ''), margin, y); y += 5.5;
    doc.text('Ciclo: ' + fmtDate(client.cicloInicio) + ' a ' + fmtDate(client.cicloFim), margin, y); y += 5.5;
    doc.text('Fechado em: ' + fmtDateTime(Date.now()), margin, y); y += 9;
    doc.setDrawColor(27,31,42); doc.line(margin, y, pageW-margin, y); y += 8;

    var total = 0;
    notas.forEach(function(n){
      if (y > 255){ doc.addPage(); y = 20; }
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text(veiculoLabel(n), margin, y);
      doc.setFont('helvetica','normal');
      doc.text(fmtMoney(n.valor), pageW-margin, y, {align:'right'});
      y += 5;
      doc.setFontSize(9); doc.setTextColor(90,90,90);
      var completa = notaCompleta(n);
      doc.text(fmtDate(n.data) + '  ·  entrega: ' + entregaLabel(n.entrega) + (n.lancadoPor ? '  ·  lançado por ' + n.lancadoPor : '') + '  ·  ' + (completa ? 'comprovante completo' : 'AGUARDANDO ASSINATURA DIGITAL'), margin, y);
      doc.setTextColor(0,0,0);
      y += 4;
      if (n.fotoNotaUrl){
        try{ doc.addImage(n.fotoNotaUrl, 'JPEG', margin, y, 45, 32); }catch(e){}
      }
      if (n.assinaturaDataUrl){
        try{ doc.addImage(n.assinaturaDataUrl, 'PNG', margin + 50, y + 8, 40, 16); }catch(e){}
      }
      y += n.fotoNotaUrl ? 36 : 4;
      doc.setDrawColor(216,209,192); doc.line(margin, y, pageW-margin, y); y += 6;
      total += Number(n.valor||0);
    });
    if (y > 255){ doc.addPage(); y = 20; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('Total do ciclo: ' + fmtMoney(total), pageW-margin, y, {align:'right'}); 

    var filename = 'AZO_' + client.nome.replace(/[^a-z0-9]+/gi,'_') + '_' + fmtDate(client.cicloFim).replace(/\//g,'-') + '.pdf';
    doc.save(filename);
  }

        }
      }catch(err){
        console.error('Erro carregando portal do cliente:', err);
        clientPortalState.error = 'Não deu pra carregar sua conta agora. Tente novamente em instantes.';
      }
      clientPortalState.checking = false;
      clientPortalState.checked = true;
      render();
      return;
    }

    if (clientPortalState.checking){
      root.innerHTML = clientWrapHtml('<h2>Carregando sua conta…</h2>');
      return;
    }
    if (clientPortalState.error){
      root.innerHTML = clientWrapHtml('<h2>Ops</h2><p class="store-line">'+escapeHtml(clientPortalState.error)+'</p><div class="sign-actions"><button class="btn btn-outline" id="cpLogout" style="flex:1;">Sair</button></div>');
      document.getElementById('cpLogout').addEventListener('click', async function(){ await auth.signOut(); clientPortalState = { checking:false, checked:false, client:null, notas:[], error:null }; render(); });
      return;
    }

    renderClientDashboard();
  }

  function renderClientLogin(){
    var root = document.getElementById('root');
    root.innerHTML = clientWrapHtml(
      '<h2>Minha conta AZO</h2>'+
      '<p class="store-line">Entre com o e-mail e a senha que a loja enviou pra você.</p>'+
      '<div class="field" style="text-align:left;"><label>E-mail</label><input id="cpEmail" type="email" placeholder="seu@email.com"></div>'+
      '<div class="field" style="text-align:left;"><label>Senha</label><input id="cpSenha" type="password" placeholder="Senha"></div>'+
      '<div class="sign-actions"><button class="btn btn-green" id="cpEntrar" style="flex:1;">Entrar</button></div>'+
      '<p class="footnote" style="margin-top:14px;"><a href="#" id="cpEsqueci" style="color:var(--thread);">Esqueci minha senha</a></p>'+
      '<p class="footnote">Ainda não tem acesso? Peça pra loja liberar pelo seu e-mail cadastrado.</p>'
    );
    document.getElementById('cpEntrar').addEventListener('click', async function(){
      var email = document.getElementById('cpEmail').value.trim();
      var senha = document.getElementById('cpSenha').value;
      if (!email || !senha){ showToast('Preencha e-mail e senha.'); return; }
      try{
        await auth.signInWithEmailAndPassword(email, senha);
        clientPortalState = { checking:false, checked:false, client:null, notas:[], error:null };
        render();
      }catch(err){
        showToast('E-mail ou senha incorretos.');
      }
    });
    document.getElementById('cpEsqueci').addEventListener('click', async function(e){
      e.preventDefault();
      var email = document.getElementById('cpEmail').value.trim();
      if (!email){ showToast('Digite seu e-mail no campo acima primeiro.'); return; }
      try{
        await auth.sendPasswordResetEmail(email);
        showToast('Enviamos um link de redefinição para '+email);
      }catch(err){
        showToast('Não achamos conta com esse e-mail. Fale com a loja.');
      }
    });
  }

  function whatsappLojaUrl(msg){
    return getConfig().then(function(cfg){
      if (!cfg.whatsappLoja) return null;
      return 'https://wa.me/55'+cfg.whatsappLoja+'?text='+encodeURIComponent(msg);
    });
  }

  async function renderClientDashboard(){
    var root = document.getElementById('root');
    var client = clientPortalState.client;
    var notas = clientPortalState.notas.slice().sort(function(a,b){ return b.data - a.data; });
    var used = clientNotasSum(client.id, notas);
    var dleft = daysLeft(client.cicloFim);
    var bloqueado = (used >= client.limite) || (Date.now() > client.cicloFim);
    var motivoBloqueio = used >= client.limite ? 'limite' : 'vencido';

    var statusHtml;
    if (bloqueado){
      var diasVencido = Math.abs(dleft);
      statusHtml = '<div class="warn-strip" style="background:rgba(196,49,49,0.1);border-color:var(--red);color:#7a1f1f;">'+
        (motivoBloqueio === 'limite' ? 'Sua conta atingiu o limite de crédito.' : 'Sua conta está em bloqueio há '+diasVencido+' dia(s).')+
        ' Entre em contato com a loja para regularizar.</div>'+
        '<div class="sign-actions" style="margin-bottom:20px;"><button class="btn btn-danger" id="cpFechamento" style="flex:1;">📩 Faça meu fechamento</button></div>';
    } else {
      statusHtml = '<div class="sign-details" style="margin-bottom:20px;"><div><span>Status</span><b style="color:var(--green);">Conta liberada</b></div><div><span>Dias restantes para comprar</span><b>'+dleft+' dia(s)</b></div></div>';
    }

    var html =
      '<div class="app">'+
      '<div class="topbar"><div class="brand"><img class="logo" src="'+LOGO_DATA_URI+'" alt="AutoZone"><div><h1>Olá, '+escapeHtml(client.nome)+'</h1><div class="sub">sua conta AZO</div></div></div>'+
      '<div class="topbar-actions"><button id="cpSair" style="background:transparent;color:#fff;border:1px solid #444;">Sair</button></div></div>'+
      statusHtml+
      '<div class="detail-stats">'+
      '<div><b>'+fmtMoney(used)+'</b>usado de '+fmtMoney(client.limite)+'</div>'+
      '<div><b>'+fmtMoney(Math.max(0, client.limite-used))+'</b>disponível</div>'+
      '<div><b>'+fmtDate(client.cicloFim)+'</b>vencimento</div>'+
      '</div>'+
      '<h3 style="margin:24px 0 10px;">Suas compras</h3>';

    if (notas.length === 0){
      html += '<div class="empty"><h3>Nenhuma compra neste ciclo</h3></div>';
    } else {
      html += '<div class="ledger">';
      notas.forEach(function(n){
        html += '<div class="nota-row"><div class="nota-info">';
        html += '<p class="nota-desc">'+escapeHtml(veiculoLabel(n))+'</p>';
        html += '<p class="nota-sub">'+fmtDate(n.data)+' · vendedor: '+escapeHtml(n.lancadoPor||'-')+(n.contestada ? ' · <span style="color:var(--red);">contestação enviada</span>' : '')+'</p>';
        html += '</div><div class="nota-value'+(n.valor<0?' negativo':'')+'">'+fmtMoney(n.valor)+'</div>';
        html += '<div class="nota-actions">'+(n.contestada ? '' : '<button class="btn btn-sm btn-outline" data-contest="'+n.id+'">Não reconheço</button>')+'</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<div class="sign-actions" style="margin-top:24px;"><button class="btn btn-outline" id="cpOrcamento" style="flex:1;">💬 Novo orçamento</button></div>';
    html += promoFooterHtml();
    html += '</div>';
    root.innerHTML = html;

    document.getElementById('cpSair').addEventListener('click', async function(){
      await auth.signOut();
      clientPortalState = { checking:false, checked:false, client:null, notas:[], error:null };
      render();
    });
    wirePromoFooter(root);
    var fechBtn = document.getElementById('cpFechamento');
    if (fechBtn) fechBtn.addEventListener('click', async function(){
      var url = await whatsappLojaUrl('Olá! Sou '+client.nome+' (PIN '+(client.pin||'-')+') e minha conta AZO está bloqueada. Podem fazer meu fechamento, por favor?');
      if (!url){ showToast('A loja ainda não configurou o WhatsApp de contato.'); return; }
      window.open(url, '_blank');
    });
    var orcBtn = document.getElementById('cpOrcamento');
    if (orcBtn) orcBtn.addEventListener('click', async function(){
      var url = await whatsappLojaUrl('Olá! Sou '+client.nome+' (PIN '+(client.pin||'-')+') e gostaria de um novo orçamento.');
      if (!url){ showToast('A loja ainda não configurou o WhatsApp de contato.'); return; }
      window.open(url, '_blank');
    });
    root.querySelectorAll('[data-contest]').forEach(function(el){
      el.addEventListener('click', function(){ openContestModal(el.getAttribute('data-contest')); });
    });
  }

  function clientNotasSum(clientId, notasList){
    return notasList.reduce(function(s,n){ return s + Number(n.valor||0); }, 0);
  }

  function openContestModal(notaId){
    var nota = clientPortalState.notas.find(function(n){ return n.id === notaId; });
    if (!nota) return;
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML =
      '<div class="modal">'+
        '<h3>Não reconheço essa compra</h3>'+
        '<p style="font-size:13.5px;color:var(--ink-soft);margin-top:0;">'+escapeHtml(veiculoLabel(nota))+' — '+fmtMoney(nota.valor)+'</p>'+
        '<div class="field"><label>Explique o que aconteceu</label><textarea id="contestMsg" rows="4" style="width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:4px;font-family:inherit;font-size:14px;"></textarea></div>'+
        '<div class="modal-actions"><button class="btn btn-outline" id="contestCancel">Cancelar</button><button class="btn btn-danger" id="contestSend">Enviar contestação</button></div>'+
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
    document.getElementById('contestCancel').addEventListener('click', function(){ overlay.remove(); });
    document.getElementById('contestSend').addEventListener('click', async function(){
      var msg = document.getElementById('contestMsg').value.trim();
      if (!msg){ showToast('Descreve rapidinho o que houve.'); return; }
      try{
        await db.collection('notas').doc(notaId).update({ contestada: true, contestacaoMotivo: msg, contestadaEm: Date.now() });
        nota.contestada = true;
        overlay.remove();
        showToast('Contestação enviada. A loja vai entrar em contato.');
        renderClientDashboard();
      }catch(err){
        showToast('Não deu pra enviar agora. Tenta de novo em instantes.');
      }
    });
  }

  window.addEventListener('hashchange', render);
  loadAll().then(render);
})();
</script>
</body>
</html>
